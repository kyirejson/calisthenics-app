apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'uncover.voice'
version = '1.0.0'
// Match the app target: do not compile three unused C++ ABIs for an ARM64 phone build.
// Explicit emulator overrides still select their own test ABI.
def voiceArchitectures = (project.findProperty('reactNativeArchitectures') ?: 'arm64-v8a').toString()
  .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
android {
  namespace 'uncover.voice'
  ndkVersion rootProject.ext.ndkVersion
  useLibrary 'android.test.runner'
  useLibrary 'android.test.base'
  // The isolated playback test includes both this CMake module and React Native's runtime.
  packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
  defaultConfig {
    ndk { abiFilters.addAll(voiceArchitectures) }
    versionCode 1; versionName '1.0.0'; consumerProguardFiles 'consumer-rules.pro'
    testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    testInstrumentationRunnerArguments['class'] = 'uncover.voice.VoiceSpeakerPlaybackTest'
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
  }
  externalNativeBuild { cmake { path 'native/CMakeLists.txt'; version '3.22.1' } }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  compileOnly files('libs/sherpa-onnx-1.13.8.aar')
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation project(':uncover-web')
  androidTestImplementation files('libs/sherpa-onnx-1.13.8.aar')
}
