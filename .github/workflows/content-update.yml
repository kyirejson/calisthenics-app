name: Publish content update (manual)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel (matching installed APK)
        required: true
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Update description
        required: true
        type: string
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.channel }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_UPDATE_CHANNEL: ${{ inputs.channel }}
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require connected Expo project
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Set the EXPO_TOKEN secret first'; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo 'Set the EXPO_PROJECT_ID variable first'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run test:updates
      - name: Publish compatible JavaScript and assets
        run: npx eas-cli@latest update --channel "$EXPO_UPDATE_CHANNEL" --environment "$EXPO_UPDATE_CHANNEL" --message "$UPDATE_MESSAGE" --non-interactive
