name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_UPDATE_CHANNEL: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run test:updates
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk uncover-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: uncover-preview.apk
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          ANDROID_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          NOTES=$(printf 'Uncover v%s Android 测试包：训练目标、每日计划、动作指导与进阶路线整合。无需 Expo Go；测试签名，仅用于真机验收。\n\nApp version: %s\nAndroid versionCode: %s\n' "$APP_VERSION" "$APP_VERSION" "$ANDROID_CODE")
          gh release create "preview-${GITHUB_RUN_NUMBER}" uncover-preview.apk --prerelease --title "Uncover Android 测试版 ${GITHUB_RUN_NUMBER}" --notes "$NOTES"
