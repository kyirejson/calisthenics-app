name: Build signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_UPDATE_CHANNEL: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require Expo access
        run: test -n "$EXPO_TOKEN" || { echo 'Configure EXPO_TOKEN first; default debug signing is not allowed'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run test:updates
      - name: Build with existing dedicated signing credentials
        run: npx eas-cli@24.8.0 build --platform android --profile production --non-interactive --freeze-credentials --wait --json > build-result.json
      - name: Download completed APK
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('build-result.json', 'utf8'));
          const build = Array.isArray(value) ? value[0] : value;
          if (build.status !== 'FINISHED' || build.appIdentifier !== 'com.zizhong.jinjie') throw Error('Build did not finish for the intended app');
          const url = build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl;
          if (!url || new URL(url).hostname !== 'expo.dev' || new URL(url).protocol !== 'https:') throw Error('Unexpected APK artifact URL');
          fs.writeFileSync('apk-url.txt', url);
          NODE
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          curl --fail --location --proto '=https' --proto-redir '=https' "$(cat apk-url.txt)" --output "uncover-v${APP_VERSION}.apk"
      - name: Publish official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          gh release create "v${APP_VERSION}" "uncover-v${APP_VERSION}.apk" --target "$GITHUB_SHA" --title "Uncover v${APP_VERSION}" --notes-file RELEASE-NOTES.md --latest
