name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk niepan-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: niepan-preview.apk
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${GITHUB_RUN_NUMBER}" niepan-preview.apk --prerelease --title "涅槃 Android 测试版 ${GITHUB_RUN_NUMBER}" --notes "涅槃 v1.1 开发测试包，包含周期训练、动作进阶和分目标营养计划。无需 Expo Go；使用框架默认测试签名，仅用于真机验收。"
